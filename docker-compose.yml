
services:

  # Laravel PHP application
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: laravel_app

    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: laravel-api
      DB_USERNAME: root
      DB_PASSWORD: secret
      APP_URL: http://localhost:8080

    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor

    depends_on:
      db:
        condition: service_healthy

    networks:
      - laravel_network

  # Nginx web server
  nginx:
    image: nginx:alpine

    container_name: laravel_nginx

    ports:
      - "8080:80"

    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

    networks:
      - laravel_network

  # MySQL database
  db:
    image: mysql:8.0

    container_name: laravel_db

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: laravel-api
      MYSQL_ROOT_PASSWORD: secret

    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -uroot -psecret -e 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - laravel_network

volumes:
  mysql_data:
  vendor:

networks:
  laravel_network:
    driver: bridge
